{% extends 'core/base.html' %}{% block content %}<h1>Novo Atendimento</h1><p>Preencha os campos obrigatórios (*).</p><form method="post" class="card p-4">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{field.id_for_label}}">{{field.label}}{% if field.field.required %} *{% endif %}</label>{{field}}{% for e in field.errors %}<div class="text-danger" role="alert">{{e}}</div>{% endfor %}</div>{% endfor %}<div class="d-flex gap-2"><button class="btn btn-primary tap">Salvar Atendimento</button><a class="btn btn-outline-secondary tap" href="/">Cancelar</a></div></form>{% endblock %}
